body {
    font-family: Arial, sans-serif;
    margin: 10px;

    font-size: 48px;
    margin-bottom: 20px;
}

.btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

button {
    flex: 1;
    padding: 40px;
    font-size: 30px;
    cursor: pointer;
    border-radius: 12px;
    border: none;
    background-color: #ff4500;
    color: white;
    transition: background 0.2s, opacity 0.2s;
}

button:hover { background-color: #e03e00; }
button:disabled { opacity: 0.6; cursor: not-allowed; }

#youtubeBtn { background-color: #cc0000; }
#youtubeBtn:hover { background-color: #aa0000; }
button.active { outline: 5px solid #333; }

ul { 
    list-style: none; 
    padding: 0; 
    margin: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
    width: 100%;
}

li {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
    width: 100%;
}

li .title-row {
    display: flex;
    align-items: center;
    font-size: 22px;
    margin-bottom: 12px;
    gap: 12px;
}

li .place {
    font-weight: bold;
    font-size: 26px;
    flex-shrink: 0;
}

li .title {
    font-weight: bold;
    color: #06f;
    text-decoration: none;
    flex: 1;
}

li .title:hover { text-decoration: underline; }

li .channel {
    font-size: 18px;
    color: #888;
    margin-bottom: 10px;
}

li .content {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
}

li img {
    width: 600px;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    flex-shrink: 0;
}

    display: flex;
    flex-direction: column;

    font-size: 40px;
}

pre {
    background: #222;
    color: #0f0;
    padding: 12px;

    margin-top: 30px;
    border-radius: 8px;

    white-space: pre-wrap;
    word-break: break-all;
}

@media (max-width: 600px) {
    .btn-row { flex-direction: column; }

</style>
</head>
<body>

<h1>🔥 Топ видео YouTube RU</h1>

<div class="btn-row">
    <button id="robloxBtn">🟥 Roblox каналы</button>
    <button id="youtubeBtn">▶️ YouTube тренды</button>
</div>

<ul id="topList"></ul>

<h2>📊 Дебаг</h2>
<pre id="debug">—</pre>

<script>
    function fmtDur(sec) {
        const h = Math.floor(sec / 3600);
        const m = Math.floor((sec % 3600) / 60);
        const s = sec % 60;
        if (h > 0) return `${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
        return `${m}:${String(s).padStart(2,'0')}`;
    }

    async function loadTrends(mode) {
        const debugEl = document.getElementById('debug');
        const topEl = document.getElementById('topList');
        const robloxBtn = document.getElementById('robloxBtn');
        const youtubeBtn = document.getElementById('youtubeBtn');

        robloxBtn.disabled = true;
        youtubeBtn.disabled = true;
        robloxBtn.classList.toggle('active', mode === 'roblox');
        youtubeBtn.classList.toggle('active', mode === 'youtube');

        debugEl.textContent = "Загрузка...";
        topEl.innerHTML = "";

        let res;
        try {
            res = await fetch(`/api/trends?mode=${mode}`);
        } catch (fetchErr) {
            debugEl.textContent = `❌ fetch() провалился:\n${fetchErr}\n\nСкорее всего сервер недоступен или неправильный URL.`;
            robloxBtn.disabled = false;
            youtubeBtn.disabled = false;
            return;
        }

        // Читаем сырой текст — чтобы видеть что реально вернул сервер
        const rawText = await res.text();
        debugEl.textContent = `HTTP ${res.status} ${res.statusText}\n\n${rawText.slice(0, 2000)}`;

        let data;
        try {
            data = JSON.parse(rawText);
        } catch (jsonErr) {
            topEl.innerHTML = `<li>❌ Сервер вернул не JSON (см. дебаг выше)</li>`;
            robloxBtn.disabled = false;
            youtubeBtn.disabled = false;
            return;
        }

        if (data.error) {
            topEl.innerHTML = `<li>❌ Ошибка API: ${data.error}</li>`;
            robloxBtn.disabled = false;
            youtubeBtn.disabled = false;
            return;
        }

        if (!data.top || data.top.length === 0) {
            topEl.innerHTML = "<li>❌ Ничего не найдено</li>";
            robloxBtn.disabled = false;
            youtubeBtn.disabled = false;
            return;
        }

        data.top.forEach((v, index) => {
            const li = document.createElement('li');

            const extra = mode === 'youtube'
                ? `<div class="channel">📺 ${v.channel}${v.durationSec ? ' · 🎬 ' + fmtDur(v.durationSec) : ''}</div>`
                : '';

            li.innerHTML = `
                <div class="title-row">
                    <div class="place">${index + 1}.</div>
                    <a class="title" href="${v.url}" target="_blank">${v.title}</a>
                </div>
                ${extra}
                <div class="content">
                    <img src="${v.thumbnail}" alt="Превью">
                    <div class="metrics">
                        ⚡ ${Math.round(v.speed)} /час<br>
                        👁 ${v.views} тыс.<br>
                        ⏱ ${v.hours.toFixed(1)}ч
                    </div>
                </div>
            `;
            topEl.appendChild(li);
        });

        robloxBtn.disabled = false;
        youtubeBtn.disabled = false;
    }

    document.getElementById('robloxBtn').addEventListener('click', () => loadTrends('roblox'));
    document.getElementById('youtubeBtn').addEventListener('click', () => loadTrends('youtube'));
</script>

</body>
</html>
