body {
    font-family: Arial, sans-serif;
    margin: 10px;
    background: #f9f9f9;
    color: #333;
}

h1 { font-size: 48px; margin-bottom: 20px; }

.btn-row {
    display: flex;
    gap: 12px;
    margin-bottom: 25px;
}

button {
    flex: 1;
    padding: 40px;
    font-size: 30px;
    cursor: pointer;
    border-radius: 12px;
    border: none;
    background-color: #ff4500;
    color: white;
    transition: background 0.2s;
}

button:hover { background-color: #e03e00; }
button:disabled { opacity: 0.6; cursor: not-allowed; }
#youtubeBtn { background-color: #cc0000; }
#youtubeBtn:hover { background-color: #aa0000; }

/* Roblox видео */
ul {
    list-style: none;
    padding: 0; margin: 0;
    display: flex;
    flex-direction: column;
    gap: 20px;
}

li {
    background: #fff;
    padding: 16px;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.15);
    display: flex;
    flex-direction: column;
}

li .title-row {
    display: flex;
    align-items: center;
    font-size: 22px;
    margin-bottom: 12px;
    gap: 12px;
}

li .place { font-weight: bold; font-size: 26px; flex-shrink: 0; }

li .title {
    font-weight: bold;
    color: #06f;
    text-decoration: none;
    flex: 1;
}

li .title:hover { text-decoration: underline; }

li .content { display: flex; gap: 15px; flex-wrap: wrap; }

li img {
    width: 600px;
    max-width: 100%;
    height: auto;
    border-radius: 8px;
    flex-shrink: 0;
}

li .metrics {
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    font-size: 40px;
}

/* YouTube тренды */
.video-count {
    font-size: 18px;
    color: #999;
    margin-bottom: 16px;
}

.themes {
    display: flex;
    flex-direction: column;
    gap: 16px;
}

.theme-card {
    background: #fff;
    border-radius: 12px;
    box-shadow: 0 0 10px rgba(0,0,0,0.12);
    padding: 20px;
    border-left: 8px solid #cc0000;
}

.theme-header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin-bottom: 8px;
}

.theme-num {
    font-size: 20px;
    color: #cc0000;
    font-weight: bold;
    flex-shrink: 0;
}

.theme-keyword {
    font-size: 34px;
    font-weight: bold;
}

.theme-stats {
    font-size: 18px;
    color: #888;
    margin-bottom: 12px;
}

.theme-videos {
    display: flex;
    flex-direction: column;
    gap: 6px;
    margin-top: 10px;
    border-top: 1px solid #eee;
    padding-top: 10px;
}

.theme-video-link {
    font-size: 18px;
    color: #06f;
    text-decoration: none;
    display: flex;
    justify-content: space-between;
    gap: 12px;
}

.theme-video-link:hover { text-decoration: underline; }

.theme-video-views {
    color: #999;
    flex-shrink: 0;
    font-size: 16px;
}

pre {
    background: #222;
    color: #0f0;
    padding: 12px;
    overflow-x: auto;
    margin-top: 30px;
    border-radius: 8px;
    font-size: 16px;
    white-space: pre-wrap;
    word-break: break-all;
}

@media (max-width: 600px) {
    .btn-row { flex-direction: column; }
    li .content { flex-direction: column; }
    li img { width: 100%; }
    li .metrics { flex-direction: row; justify-content: space-between; margin-top: 8px; }
    .theme-keyword { font-size: 26px; }
}

</style>

<body>

<h1>Топ YouTube RU</h1>

<div class="btn-row">
    <button id="robloxBtn">Roblox каналы</button>
    <button id="youtubeBtn">YouTube тренды</button>
</div>

<div id="result"></div>

<h2>Дебаг</h2>
<pre id="debug">—</pre>

<script>
function renderRoblox(data) {
    if (!data.top || data.top.length === 0) return "<p>Ничего не найдено</p>";
    const items = data.top.map((v, i) => `
        <li>
            <div class="title-row">
                <div class="place">${i + 1}.</div>
                <a class="title" href="${v.url}" target="_blank">${v.title}</a>
            </div>
            <div class="content">
                <img src="${v.thumbnail}" alt="Превью">
                <div class="metrics">
                    ⚡ ${Math.round(v.speed)} /час<br>
                    👁 ${v.views} тыс.<br>
                    ⏱ ${v.hours.toFixed(1)}ч
                </div>
            </div>
        </li>
    `).join("");
    return "<ul>" + items + "</ul>";
}

function renderYoutube(data) {
    if (!data.themes || data.themes.length === 0) return "<p>Темы не найдены</p>";

    const cards = data.themes.map((t, i) => {
        const videos = (t.topVideos || []).map(v => `
            <a class="theme-video-link" href="${v.url}" target="_blank">
                <span>${v.title}</span>
                <span class="theme-video-views">👁 ${v.views}K</span>
            </a>
        `).join("");

        return `
            <div class="theme-card">
                <div class="theme-header">
                    <span class="theme-num">#${i + 1}</span>
                    <span class="theme-keyword">${t.keyword}</span>
                </div>
                <div class="theme-stats">
                    встречается в ${t.count} видео · ~${t.totalViews}M просмотров суммарно
                </div>
                <div class="theme-videos">${videos}</div>
            </div>
        `;
    }).join("");

    return `<div class="video-count">Проанализировано ${data.videoCount} трендовых видео</div><div class="themes">${cards}</div>`;
}

async function loadTrends(apiPath, mode) {
    const debugEl = document.getElementById('debug');
    const resultEl = document.getElementById('result');

    debugEl.textContent = "Загрузка...";
    resultEl.innerHTML = "<p>Загрузка...</p>";

    const res = await fetch(apiPath);
    const rawText = await res.text();
    debugEl.textContent = "HTTP " + res.status + "\n\n" + rawText.slice(0, 3000);

    let data;
    try {
        data = JSON.parse(rawText);
    } catch (e) {
        resultEl.innerHTML = "<p>Сервер вернул не JSON — смотри дебаг</p>";
        return;
    }

    if (data.error) {
        resultEl.innerHTML = "<p>Ошибка: " + data.error + "</p>";
        return;
    }

    resultEl.innerHTML = mode === "youtube" ? renderYoutube(data) : renderRoblox(data);
}

document.getElementById('robloxBtn').addEventListener('click', function() {
    loadTrends('/api/trends', 'roblox');
});

document.getElementById('youtubeBtn').addEventListener('click', function() {
    loadTrends('/api/youtube', 'youtube');
});
</script>

</body>
</html>
